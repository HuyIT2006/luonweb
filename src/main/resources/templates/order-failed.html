<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao dịch thất bại - Lươn Việt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="success-container" style="max-width: 600px; margin: 4rem auto; text-align: center; padding: 3rem; background: #fff; border-radius: 16px;">
        <div style="width: 80px; height: 80px; background: #fde8e8; color: #c81e1e; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>
        
        <h2 class="brand-font" style="color: #c81e1e; margin-bottom: 1rem;">Giao dịch thất bại</h2>
        <p style="color: #666; line-height: 1.6;" th:text="${error != null ? error : 'Quá trình thanh toán đã bị hủy hoặc xảy ra lỗi. Vui lòng thử lại.'}">Lỗi thanh toán.</p>

        <a th:href="@{/order/checkout}" class="btn btn-primary" style="margin-top: 2rem; display: inline-block;">Thử lại thanh toán</a>
    </main>

</body>
</html>
