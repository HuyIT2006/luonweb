<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - Lươn Việt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .cart-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }
        .cart-table th {
            text-align: left;
            padding: 1rem;
            border-bottom: 2px solid var(--sage);
            color: var(--forest-deep);
            font-family: 'Fraunces', serif;
        }
        .cart-table td {
            padding: 1rem;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }
        .cart-item-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .qty-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .qty-input {
            width: 50px;
            text-align: center;
            padding: 0.25rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .cart-summary {
            background: #f9fdfa;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: right;
            border: 1px solid var(--sage);
        }
        .cart-total {
            font-size: 1.5rem;
            color: var(--forest-deep);
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .btn-remove {
            background: #ff4d4f;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-remove:hover {
            background: #d9363e;
        }
        .empty-cart {
            text-align: center;
            padding: 3rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="cart-container">
        <h2 class="brand-font" style="margin-bottom: 1.5rem; color: var(--forest-deep);">Giỏ Hàng Của Bạn</h2>

        <div th:if="${successMessage}" class="alert" style="background: #e6f4ea; color: #1e4620; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;" th:text="${successMessage}"></div>

        <div th:if="${cartItems.isEmpty()}" class="empty-cart">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" style="margin-bottom: 1rem;"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <h3>Giỏ hàng đang trống</h3>
            <p>Hãy thêm một vài sản phẩm lươn tươi ngon vào giỏ hàng nhé!</p>
            <a th:href="@{/}" class="btn btn-primary" style="margin-top: 1rem; display: inline-block;">Tiếp tục mua sắm</a>
        </div>

        <div th:unless="${cartItems.isEmpty()}">
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cartItems}">
                        <td>
                            <div class="cart-item-info">
                                <img th:src="@{${item.product.imageUrl != null ? item.product.imageUrl : '/images/default-luon.jpg'}}" alt="Product" class="cart-item-img">
                                <span th:text="${item.product.name}" style="font-weight: 500;">Tên SP</span>
                            </div>
                        </td>
                        <td th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 0, 'POINT')} + '₫'">100.000₫</td>
                        <td>
                            <form th:action="@{/cart/update}" method="POST" class="qty-control">
                                <input type="hidden" name="cartItemId" th:value="${item.id}">
                                <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="qty-input" onchange="this.form.submit()">
                            </form>
                        </td>
                        <td style="font-weight: 600; color: var(--amber);" th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + '₫'">100.000₫</td>
                        <td>
                            <form th:action="@{/cart/remove}" method="POST">
                                <input type="hidden" name="cartItemId" th:value="${item.id}">
                                <button type="submit" class="btn-remove">Xóa</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="cart-summary">
                <div class="cart-total">
                    Tổng thanh toán: <span style="color: var(--amber);" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</span>
                </div>
                <a th:href="@{/order/checkout}" class="btn btn-primary-lg" style="display: inline-block;">Tiến hành đặt hàng</a>
            </div>
        </div>
    </main>

</body>
</html>
