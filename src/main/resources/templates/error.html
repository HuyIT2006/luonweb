<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi - Lươn Việt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <i class="fas fa-exclamation-triangle text-warning mb-4" style="font-size: 5rem;"></i>
                <h1 class="display-4" th:text="${errorTitle != null ? errorTitle : 'Đã xảy ra lỗi'}">Đã xảy ra lỗi</h1>
                <p class="lead text-muted" th:text="${errorMessage != null ? errorMessage : 'Rất tiếc, yêu cầu của bạn không thể thực hiện được vào lúc này.'}">
                    Nội dung lỗi chi tiết
                </p>
                <div class="mt-4">
                    <a href="/" class="btn btn-primary me-2"><i class="fas fa-home me-2"></i>Về trang chủ</a>
                    <button onclick="history.back()" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Quay lại</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
