<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="sidebar" class="admin-sidebar">
        <div class="admin-sidebar-logo">
            <a th:href="@{/admin}" class="brand-logo">Lươn Việt<span class="brand-dot">.</span></a>
            <small>Quản trị viên</small>
        </div>

        <ul class="admin-nav">
            <li>
                <a th:href="@{/admin}" th:classappend="${currentPage == 'dashboard'} ? 'active' : ''">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    <span>Tổng quan</span>
                </a>
            </li>
            <div class="admin-nav-section">Quản lý</div>
            <li>
                <a th:href="@{/admin/products}" th:classappend="${currentPage == 'products'} ? 'active' : ''">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                    <span>Sản phẩm</span>
                </a>
            </li>
            <li>
                <a th:href="@{/admin/orders}" th:classappend="${currentPage == 'orders'} ? 'active' : ''">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line></svg>
                    <span>Đơn hàng</span>
                </a>
            </li>
            <li>
                <a th:href="@{/admin/users}" th:classappend="${currentPage == 'users'} ? 'active' : ''">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    <span>Người dùng</span>
                </a>
            </li>
            <div class="admin-nav-section">Hệ thống</div>
            <li>
                <a th:href="@{/}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                    <span>Về trang chủ</span>
                </a>
            </li>
            <li>
                <a th:href="@{/logout}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    <span>Đăng xuất</span>
                </a>
            </li>
        </ul>
    </nav>
</body>
</html>
