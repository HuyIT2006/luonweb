<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng - Lươn Việt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="admin-layout" th:with="currentPage='orders'">
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

        <div class="admin-content">
            <div class="admin-topbar">
                <h1>Quản lý Đơn hàng</h1>
            </div>

            <div class="admin-main">
                <div th:if="${success}" class="admin-alert admin-alert-success" th:text="${success}"></div>

                <div class="admin-table-container">
                    <div class="admin-table-header">
                        <h3 class="brand-font">Tất cả đơn hàng (<span th:text="${#lists.size(orders)}">0</span>)</h3>
                    </div>
                    <div style="overflow-x: auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Mã</th>
                                <th>Khách hàng</th>
                                <th>SĐT</th>
                                <th>Địa chỉ</th>
                                <th>Tổng tiền</th>
                                <th>Hình thức TT</th>
                                <th>Trạng thái TT</th>
                                <th>Trạng thái đơn</th>
                                <th>Ngày đặt</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td style="font-weight: 600;">#<span th:text="${order.id}">1</span></td>
                                <td th:text="${order.fullName}">Tên KH</td>
                                <td th:text="${order.phone}">0900...</td>
                                <td style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${order.address}" th:title="${order.address}">Địa chỉ...</td>
                                <td style="color: var(--amber); font-weight: 600;" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</td>
                                <td>
                                    <span th:text="${order.paymentMethod.name()}">COD</span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/orders/{id}/payment(id=${order.id})}" method="POST" class="inline-form">
                                        <select name="paymentStatus" onchange="this.form.submit()">
                                            <option value="UNPAID" th:selected="${order.paymentStatus.name() == 'UNPAID'}">Chưa TT</option>
                                            <option value="PAID" th:selected="${order.paymentStatus.name() == 'PAID'}">Đã TT</option>
                                        </select>
                                    </form>
                                </td>
                                <td>
                                    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="POST" class="inline-form">
                                        <select name="status" onchange="this.form.submit()">
                                            <option value="PENDING" th:selected="${order.status.name() == 'PENDING'}">Chờ xử lý</option>
                                            <option value="PROCESSING" th:selected="${order.status.name() == 'PROCESSING'}">Đang xử lý</option>
                                            <option value="SHIPPED" th:selected="${order.status.name() == 'SHIPPED'}">Đang giao</option>
                                            <option value="DELIVERED" th:selected="${order.status.name() == 'DELIVERED'}">Đã giao</option>
                                            <option value="CANCELLED" th:selected="${order.status.name() == 'CANCELLED'}">Đã hủy</option>
                                        </select>
                                    </form>
                                </td>
                                <td style="color: #888; font-size: 0.85rem;" th:text="${#temporals.format(order.createdAt, 'HH:mm dd/MM/yyyy')}">12:00 01/01/2026</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(orders)}">
                                <td colspan="9" style="text-align: center; color: #888; padding: 2rem;">Chưa có đơn hàng nào</td>
                            </tr>
                        </tbody>
                    </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
