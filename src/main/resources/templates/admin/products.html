<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm - Lươn Việt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="admin-layout" th:with="currentPage='products'">
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

        <div class="admin-content">
            <div class="admin-topbar">
                <h1>Quản lý Sản phẩm</h1>
                <a th:href="@{/admin/products/add}" class="btn btn-primary" style="padding: 0.5rem 1rem;">+ Thêm sản phẩm</a>
            </div>

            <div class="admin-main">
                <div th:if="${success}" class="admin-alert admin-alert-success" th:text="${success}"></div>

                <div class="admin-table-container">
                    <div class="admin-table-header">
                        <h3 class="brand-font">Tất cả sản phẩm (<span th:text="${#lists.size(products)}">0</span>)</h3>
                    </div>
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Sản phẩm</th>
                                <th>Danh mục</th>
                                <th>Giá</th>
                                <th>Nổi bật</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="prod : ${products}">
                                <td style="font-weight: 600; color: #888;">#<span th:text="${prod.id}">1</span></td>
                                <td>
                                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                                        <div style="width: 48px; height: 48px; border-radius: 8px; background: var(--mist); display: flex; align-items: center; justify-content: center; overflow: hidden;">
                                            <img th:if="${prod.imageUrl != null}" th:src="@{${prod.imageUrl}}" style="width: 100%; height: 100%; object-fit: cover;">
                                        </div>
                                        <span style="font-weight: 500;" th:text="${prod.name}">Tên SP</span>
                                    </div>
                                </td>
                                <td th:text="${prod.category != null ? prod.category.name : 'Chưa phân loại'}">Danh mục</td>
                                <td style="color: var(--amber); font-weight: 600;" th:text="${#numbers.formatDecimal(prod.price, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</td>
                                <td>
                                    <span th:if="${prod.featured}" class="badge badge-active">✓ Có</span>
                                    <span th:unless="${prod.featured}" style="color: #ccc;">—</span>
                                </td>
                                <td>
                                    <div style="display: flex; gap: 0.5rem;">
                                        <a th:href="@{/admin/products/edit/{id}(id=${prod.id})}" class="btn-sm btn-edit">Sửa</a>
                                        <form th:action="@{/admin/products/delete/{id}(id=${prod.id})}" method="POST" style="margin:0;" onsubmit="return confirm('Bạn chắc chắn muốn xóa sản phẩm này?');">
                                            <button type="submit" class="btn-sm btn-delete">Xóa</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(products)}">
                                <td colspan="6" style="text-align: center; color: #888; padding: 2rem;">Chưa có sản phẩm nào</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
